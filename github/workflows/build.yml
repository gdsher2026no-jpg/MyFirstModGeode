
name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: build/*.geode
